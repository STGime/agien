[project]
name = "agien-ml"
version = "0.0.0"
description = "Agien ML training and evaluation (pytest suite)"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
