[project]
name = "agien-ml"
version = "0.0.0"
description = "Agien ML training and evaluation (pytest suite)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
