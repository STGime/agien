name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge:
    name: edge (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test edge
        run: deno test apps/edge/

  js:
    name: js (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beacon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  ml:
    name: ml (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test ml
        run: cd ml && uv run pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Install JS deps
        run: cd packages/beacon && npm ci
      - name: Lint
        run: make lint
